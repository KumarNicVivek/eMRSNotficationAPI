name: Build and deploy AuthService to Azure Web App

on:
  push:
    branches:
      - master
    paths:
      - 'AuthService/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build AuthService
        run: dotnet build ./AuthService/AuthService.csproj --configuration Release

      - name: Publish AuthService
        run: dotnet publish ./AuthService/AuthService.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: authservice-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: authservice-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_58B926D660134B3FA73EE5BE3187C297 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1F85930B91D64B669D5719810AE8A61D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_393181906EAA4EB3962294035B3DDE9A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'emrsauthapi'
          package: .
